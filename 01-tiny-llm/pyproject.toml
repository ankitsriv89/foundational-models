[project]
name = "tiny-llm"
version = "0.0.1"
description = "A ~10M-parameter decoder-only transformer pretrained from scratch on FineWeb-Edu, then SFT-tuned."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # Tokenizer + dataset streaming for Phase 2 + 3.
    "tokenizers>=0.20",
    "datasets>=3.0",
    "huggingface-hub>=0.25",
    # General utilities used across phases.
    "numpy>=1.26",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[dependency-groups]
# Heavy ML stack — only installed when actually training.
# Run: uv sync --group train
train = [
    "torch>=2.4",
    "wandb>=0.18",
]
# Local testing — CPU-only PyTorch checks of model.py shape correctness.
test = [
    "torch>=2.4",
    "pytest>=8.0",
]
# Eval harness — only installed for the eval phase.
eval = [
    "lm-eval>=0.4.4",
]
# Inference serving — only installed for the deployment phase.
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "gradio>=4.44",
]

[tool.uv]
package = false
